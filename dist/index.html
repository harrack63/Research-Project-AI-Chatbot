<!DOCTYPE html><html lang="en"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="HealthBot AI Assistant"><link rel="icon" type="image/png" href="/healthChatbot/favicon.png"><link rel="icon" type="image/x-icon" href="/healthChatbot/favicon.ico"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><title>HealthBot</title><link rel="stylesheet" href="/healthChatbot/_astro/chat.B-x1rHIa.css"></head> <body class="bg-slate-950 min-h-screen text-slate-200 antialiased">  <div id="home-loader" class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-900 to-blue-950"> <svg class="w-8 h-8 animate-spin text-blue-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"> <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle> <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path> </svg> </div>  </body></html> <script>(function(){const basePath = "/healthChatbot";

  // Client-side auth check and redirect
  const TOKEN_KEY = 'healthbot_token';
  const USER_KEY = 'healthbot_user';

  function checkAuth() {
    const token = localStorage.getItem(TOKEN_KEY);
    const userRaw = localStorage.getItem(USER_KEY);
    
    // Check for route parameter
    const params = new URLSearchParams(window.location.search);
    const route = params.get('route');
    
    if (route) {
      window.location.replace(route);
      return;
    }
    
    if (token && userRaw) {
      try {
        const user = JSON.parse(userRaw);
        if (user && user.id) {
          window.location.replace(`${basePath}/chat`);
          return;
        }
      } catch (e) {
        // Invalid user data
      }
    }
    
    // Not signed in
    window.location.replace(`${basePath}/sign-in`);
  }

  // Run on page load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', checkAuth);
  } else {
    checkAuth();
  }
})();</script>
